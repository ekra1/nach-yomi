      - name: Install local media and caption tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet 'faster-whisper==1.2.1'
      - name: Complete and validate initial retained-library import
        run: |
          python scripts/bootstrap_library.py
          python scripts/validate_library.py
      - name: Update public podcast audio and automatic captions
        id: ingest
        continue-on-error: true
        run: python scripts/podcast_update.py
      - name: Validate retained library and review files
        run: python scripts/validate_library.py
      - name: Commit scoped library changes
        run: |
          git config user.name 'nach-yomi-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .nach-bootstrap-complete catalog.json index.html app.js styles.css nach.js seed.js captions.js review.js thumb.svg manifest.webmanifest audio c r scripts README.md maintenance-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Maintain Nach audio, captions and review queue'
            git push
          fi
      - name: Retain ingest outcome
        run: echo '${{ steps.ingest.outcome }}'
    outputs:
      ingest: ${{ steps.ingest.outcome }}
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
  report:
    needs: [update, deploy]
    if: needs.update.outputs.ingest == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Podcast ingestion needs attention. See maintenance-state.json and update job. Existing library remains available. Reviews awaiting assistant review stay explicitly pending.'
          exit 1
